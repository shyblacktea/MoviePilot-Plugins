name: Plugin Release
on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package.v2.json'
      - 'package.v3.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip

      - name: Check plugin versions
        run: python .github/scripts/check_plugin_versions.py package.json package.v2.json package.v3.json

      - name: Check federation CSS
        run: python .github/scripts/check_federation_css.py

      - name: Build and release changed plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail

          # Track processed tags to avoid duplicates across package files.
          : > processed_tags.txt

          process_package() {
            local pkg_file="$1"
            [ -f "$pkg_file" ] || return 0

            echo "Processing $pkg_file"

            # Only entries explicitly marked release=true are packaged.
            mapfile -t entries < <(jq -r 'to_entries | map(select(.value.release == true)) | .[] | "\(.key)|\(.value.version)|\(.value.name // .key)"' "$pkg_file")

            if [ "${#entries[@]}" -eq 0 ]; then
              echo "No plugins with release=true in $pkg_file"
              return 0
            fi

            for entry in "${entries[@]}"; do
              plugin_id="${entry%%|*}"
              rest="${entry#*|}"
              plugin_version="${rest%%|*}"
              plugin_name="${rest#*|}"
              [ -n "$plugin_name" ] || plugin_name="$plugin_id"
              release_title="${plugin_name} v${plugin_version}"
              plugin_id_lc="$(echo "$plugin_id" | tr '[:upper:]' '[:lower:]')"

              # 按索引所属代际选目录：v2/v3 同名插件两代并存时，v2 条目不能再取到 v3 目录。
              plugin_dir=""
              if [ "$pkg_file" = "package.v3.json" ]; then
                [ -d "plugins.v3/${plugin_id_lc}" ] && plugin_dir="plugins.v3/${plugin_id_lc}"
                [ -z "$plugin_dir" ] && [ -d "plugins/${plugin_id_lc}" ] && plugin_dir="plugins/${plugin_id_lc}"
              elif [ "$pkg_file" = "package.v2.json" ]; then
                [ -d "plugins.v2/${plugin_id_lc}" ] && plugin_dir="plugins.v2/${plugin_id_lc}"
                [ -z "$plugin_dir" ] && [ -d "plugins/${plugin_id_lc}" ] && plugin_dir="plugins/${plugin_id_lc}"
              else
                [ -d "plugins/${plugin_id_lc}" ] && plugin_dir="plugins/${plugin_id_lc}"
                [ -z "$plugin_dir" ] && [ -d "plugins.v2/${plugin_id_lc}" ] && plugin_dir="plugins.v2/${plugin_id_lc}"
              fi

              if [ -z "$plugin_dir" ]; then
                echo "WARN: directory for $plugin_id not found under plugins/ or plugins.v2/, skip."
                continue
              fi

              tag="${plugin_id}_v${plugin_version}"
              asset="${plugin_id_lc}_v${plugin_version}.zip"
              release_notes="$(jq -r --arg plugin_id "$plugin_id" --arg version "$plugin_version" --arg vversion "v$plugin_version" '.[$plugin_id].history[$version] // .[$plugin_id].history[$vversion] // empty' "$pkg_file")"
              if [ -z "$release_notes" ]; then
                release_notes="Automated release of $plugin_id $plugin_version"
              fi

              if grep -qxF "$tag" processed_tags.txt; then
                echo "Tag $tag already processed, skip."
                continue
              fi

              # 基准 tag 只取「版本号 <= 当前版本、且真的包含该代目录」的最新一个。
              # 之前的写法直接取版本最高的 tag，v2/v3 同 ID 插件会互相拿对方的 tag 当基准
              # （如 v0.24 的条目拿 v1.1.14 对比），判定「有变化」后删掉同版本 tag 重建。
              prev_tag=""
              while read -r candidate; do
                [ -n "$candidate" ] || continue
                cand_ver="${candidate#${plugin_id}_v}"
                if [ "$(printf '%s\n%s\n' "$cand_ver" "$plugin_version" | sort -V | tail -n 1)" != "$plugin_version" ]; then
                  continue
                fi
                if git cat-file -e "${candidate}:${plugin_dir}" 2>/dev/null; then
                  prev_tag="$candidate"
                  break
                fi
              done < <(git tag --list "${plugin_id}_v*" --sort=-version:refname)

              # 当前版本号的 tag 已存在但目录有改动：拒绝发布，绝不同版本重建 tag。
              cur_tag="${plugin_id}_v${plugin_version}"
              if git rev-parse -q --verify "refs/tags/${cur_tag}" >/dev/null 2>&1 \
                 && ! git diff --quiet "$cur_tag" -- "$plugin_dir"; then
                echo "ERROR: ${plugin_dir} 自 ${cur_tag} 之后有改动，但版本号仍是 ${plugin_version}；请先升版本号再发布。" >&2
                exit 1
              fi

              changed=1
              if [ -n "$prev_tag" ]; then
                if git diff --quiet "$prev_tag" -- "$plugin_dir"; then
                  changed=0
                fi
              fi

              if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
                changed=1
              fi

              if [ "$changed" -eq 0 ]; then
                echo "No changes in $plugin_dir since $prev_tag, skip packaging $plugin_id."
                if gh release view "$tag" >/dev/null 2>&1; then
                  gh release edit "$tag" --title "$release_title" --notes "$release_notes"
                fi
                echo "$tag" >> processed_tags.txt
                continue
              fi

              echo "Packing $plugin_id from $plugin_dir -> $asset"
              rm -f "$asset"
              (cd "$plugin_dir" && zip -r "$GITHUB_WORKSPACE/$asset" . -x "tests/*" -x "*/tests/*" -x "node_modules/*" -x "*/node_modules/*" -x "*/__pycache__/*" -x "__pycache__/*" -x "*.pyc") >/dev/null

              # Re-running a version replaces the release asset for that plugin.
              if gh release view "$tag" >/dev/null 2>&1; then
                echo "Release $tag exists, deleting..."
                gh release delete "$tag" -y --cleanup-tag
                git push origin :refs/tags/"$tag" || true
              fi

              git tag -d "$tag" >/dev/null 2>&1 || true

              echo "Creating release $tag"
              gh release create "$tag" "$asset" --title "$release_title" --notes "$release_notes" --latest --target "$GITHUB_SHA"

              echo "$tag" >> processed_tags.txt
            done
          }

          process_package "package.json"
          process_package "package.v2.json"
          process_package "package.v3.json"
